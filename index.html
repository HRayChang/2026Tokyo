async function preloadDay(btn){
  const M=dayModel(DAYS[cur]),urls=new Set(),r=(window.devicePixelRatio||1)>1?'@2x':'',base=TILE();
  M.groups.filter(g=>g.ll[0]>30).forEach(g=>{const[la,lo]=g.ll;
    for(let z=12;z<=16;z++){const n=2**z,x=Math.floor((lo+180)/360*n),y=Math.floor((1-Math.log(Math.tan(la*Math.PI/180)+1/Math.cos(la*Math.PI/180))/Math.PI)/2*n),k=z>=14?1:0;
      for(let dx=-k;dx<=k;dx++)for(let dy=-k;dy<=k;dy++){const X=x+dx,Y=y+dy;
        urls.add(base.replace('{s}','abcd'[Math.abs(X+Y)%4]).replace('{z}',z).replace('{x}',X).replace('{y}',Y).replace('{r}',r))}}});
  const list=[...urls];let n=0,ok=0;btn.disabled=true;
  const work=async()=>{while(list.length){const u=list.pop();try{const res=await fetch(u,{mode:'cors'});if(res.ok)ok++}catch(e){}n++;if(n%10===0)btn.textContent=`預載中 ${n}/${n+list.length}`}};
  await Promise.all([work(),work(),work(),work(),work(),work()]);
  btn.textContent=ok?`✓ 已預載 ${ok} 張`:'預載失敗（需網路）';btn.disabled=false;
}

  tourDraw();tourPos();setTimeout(tourPos,250);setTimeout(tourPos,800);
}
function tourDraw(){
  const s=TS[tourI],last=tourI===TS.length-1,X=typeof s.x==='function'?s.x():s.x;
  $('#ttip').innerHTML=`<i class="tarr" id="tarr"></i><div class="tn">${tourI+1} / ${TS.length}</div><div class="tt">${esc(s.t)}</div><div class="tx">${esc(X).replace(/\n/g,'<br>')}</div>${s.act?`<div class="tact">${esc(s.act)}</div>`:''}
  <div class="tbtn">${tourI>0?'<button data-tour="prev">上一步</button>':''}<button class="pri" data-tour="next">${last?'開始使用 ✈️':tourI===0?'開始':s.act&&s.within?'略過這步':'下一步'}</button></div>${last?'':'<button class="tskip" data-tour="skip">結束教學</button>'}`;
}
function tourPos(){
  const root=$('#tour');if(root.hidden)return;
  const s=TS[tourI],el=tgt(s),vw=innerWidth,vh=innerHeight,B=root.querySelectorAll('.tb'),sp=$('#tspot'),tip=$('#ttip'),ar=$('#tarr');
  const box=(b,l,t,w,h)=>{b.style.cssText=`left:${l}px;top:${t}px;width:${Math.max(0,w)}px;height:${Math.max(0,h)}px`};
  B[0].classList.toggle('dim',!el);
  if(!el){
    B.forEach((b,n)=>{if(n===0)box(b,0,0,vw,vh);else b.style.cssText='display:none'});
    sp.style.display='none';tip.style.cssText='left:50%;top:50%;transform:translate(-50%,-50%)';if(ar)ar.style.display='none';return;
  }
  const r=el.getBoundingClientRect(),p=s.pad??8;
  const L=Math.max(0,r.left-p),T=Math.max(0,r.top-p),R=Math.min(vw,r.right+p),Bt=Math.min(vh,r.bottom+p);
  sp.style.cssText=`left:${L}px;top:${T}px;width:${R-L}px;height:${Bt-T}px`;
  box(B[0],0,0,vw,T);box(B[1],0,Bt,vw,vh-Bt);box(B[2],0,T,L,Bt-T);box(B[3],R,T,vw-R,Bt-T);
  if(s.within)B[4].style.cssText='display:none';else box(B[4],L,T,R-L,Bt-T);
  const tw=tip.offsetWidth,th=tip.offsetHeight,below=vh-Bt,above=T;let top,up=false;
  if(below>=th+18||below>=above)top=Bt+12;else{top=T-th-12;up=true}
  top=Math.min(Math.max(8,top),vh-th-8);
  const left=Math.min(Math.max(12,(L+R)/2-tw/2),vw-tw-12);
  tip.style.cssText=`left:${left}px;top:${top}px`;
  if(ar){const ov=!(top+th<=T||top>=Bt);ar.style.display=ov?'none':'block';ar.className='tarr '+(up?'dn':'up');ar.style.left=Math.min(Math.max(14,(L+R)/2-left-8),tw-30)+'px'}
}
function openTour(){
  tourCur=cur;tourMode=mode;menuEl().hidden=true;if(!$('#view').hidden)closeView();
  forceList();tourI=0;$('#tour').hidden=false;clearInterval(tourTimer);tourTimer=setInterval(tourPos,400);tourShow(1);
}
function tourClose(){
  $('#tour').hidden=true;clearInterval(tourTimer);tourTok++;menuEl().hidden=true;tourSeen=true;store.set('tour','1');
  cur=tourCur;mode=tourMode;store.set('view',mode);refit=true;render();scrollTo(0,0);
  if(mode==='list'&&liveDayIdx()>=0)goNow(false);
}
/* 捕獲階段：教學層上的點擊只給教學用；點在「高亮處」的真實操作照常執行，執行後自動進到下一步 */
document.addEventListener('click',e=>{
  if($('#tour').hidden)return;
  if(e.target.closest('#tour')){
    e.stopPropagation();e.preventDefault();
    const t=e.target.closest('[data-tour]');if(!t)return;
    const a=t.dataset.tour;
    if(a==='next'){if(tourI>=TS.length-1)tourClose();else{tourI++;tourShow(1)}}
    else if(a==='prev'&&tourI>0){tourI--;tourShow(-1)}
    else if(a==='skip')tourClose();
    return;
  }
  const s=TS[tourI];
  if(s&&s.within&&e.target.closest(s.within)){const tk=tourTok;setTimeout(()=>{if(tk===tourTok&&!$('#tour').hidden){tourI++;tourShow(1)}},500)}
},true);
addEventListener('resize',tourPos);
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#tour').hidden)tourClose()});
startLive();
if(!tourSeen&&store.get('tour')!=='1')setTimeout(openTour,400);
</script>
</body>
