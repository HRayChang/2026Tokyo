function infer(day){
  const now=Date.now(),its=day.items;
  const cards=its.map((x,i)=>i).filter(i=>its[i].k==='place'||its[i].k==='move');
  let prev=-1,next=-1;
  for(const i of cards){if(!its[i].ts||its[i].noanchor)continue;if(its[i].ts<=now)prev=i;else{next=i;break}}
  const start=prev>=0?prev:0,end=next>=0?next:its.length;
  let win=cards.filter(i=>i>=start&&i<end&&!doneU(its[i]));
  if(!win.length){const a=cards.filter(i=>i>=end&&!doneU(its[i]));
    const b=a.length?a:cards.filter(i=>!doneU(its[i]));if(!b.length)return null;win=[b[0]]}
  let pick=win[0],d=null,mode='time';
  if(loc){
    const ds=win.filter(i=>its[i].ll).map(i=>({i,d:dist(loc.lat,loc.lng,its[i].ll[0],its[i].ll[1])}));
    if(ds.length){const m=Math.min(...ds.map(x=>x.d));
      if(m<3000){const best=ds.find(x=>x.d<=m+150);pick=best.i;d=best.d;mode='geo'}else mode='far'}

}

const TILE=()=>'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png'; /* 國土地理院 淡色地圖：免金鑰、日本全區、地名為日文 */
function dayModel(day){
  const groups=[],by={},edges=[],rows=[];let prev=null,mv=false;
  /* 每天地圖的 1 號點都從飯店開始 */
  const HLL=LL['Season Hotel 押上'],first=day.d===DAYS[0].d;
  let seenHotel=true; /* 第一天維持原本：從機場接送點開始 */
  if(!first){
    const fk={id:'hotelstart:'+day.d,k:'place',title:'🏨 從飯店出發',sub:HOTEL,q:'Season Hotel 押上',ll:HLL,gn:'飯店・押上'};
    const g=by[HLL.join(',')]={key:HLL.join(','),ll:HLL,items:[fk],n:1,name:'飯店・押上'};groups.push(g);rows.push({it:fk,g});prev=g;
  }
  day.items.forEach(it=>{
    if(it.k==='move'){mv=true;return}
    if(it.k!=='place')return;
    /* 第一天：飯店（寄放行李）之前的機場／航班不上地圖，讓 1 號點是飯店 */
    if(!seenHotel){if(it.bk==='hotel')seenHotel=true;else{rows.push({it,g:null});return}}
    if(!it.ll){rows.push({it,g:null});return}
    const key=it.ll.join(',');let g=by[key];

  });

function fitDay(){

  /* 離群點（例如成田機場）不納入縮放範圍，避免市區的點擠在一起 */
  const med=a=>[...a].sort((x,y)=>x-y)[Math.floor(a.length/2)],mc=[med(pts.map(p=>p[0])),med(pts.map(p=>p[1]))];
  const near=pts.filter(p=>dist(mc[0],mc[1],p[0],p[1])<25000);if(near.length>=2)pts=near;

/* 離線預載：目前這天每個地點周邊的地圖圖磚（之後離線也看得到） */
async function preloadDay(btn){

      for(let dx=-k;dx<=k;dx++)for(let dy=-k;dy<=k;dy++){const X=x+dx,Y=y+dy;
        urls.add(base.replace('{s}','abcd'[Math.abs(X+Y)%4]).replace('{z}',z).replace('{x}',X).replace('{y}',Y).replace('{r}',r))}}});
  const list=[...urls];let n=0,ok=0;btn.disabled=true;
  const work=async()=>{while(list.length){const u=list.pop();try{const res=await fetch(u,{mode:'cors'});if(res.ok)ok++}catch(e){}n++;if(n%10===0)btn.textContent=`預載中 ${n}/${n+list.length}`}};
  await Promise.all([work(),work(),work(),work(),work(),work()]);

    else if(t.dataset.map){mode='map';store.set('view','map');pendingFocus={id:t.dataset.map,popup:true};render();scrollTo(0,0)}
    else if(t.dataset.dr){const[id,a]=t.dataset.dr.split('|');
      if(a==='clear')store.del('dr:'+id);else if(a==='lose')store.set('dr:'+id,JSON.stringify({s:'lose'}));else store.set('dr:'+id,JSON.stringify({s:'win',k:+a.split(':')[1]}));
      store.del('n:'+id);applyDraw();render()}
    else if(t.id==='mnow')startLive();
    else if(t.id==='tPre')preloadDay(t);
    return;
  }
  const row=e.target.closest('[data-focus]');if(row){setSheet(0);focusItem(row.dataset.focus,true)}
});
addEventListener('resize',()=>{if(mode==='map'&&mapObj){positionMap();mapObj.invalidateSize()}});
/* ---- 選單與頁面（出發前清單／已預訂） ---- */
const BKI={};DAYS.forEach((d,di)=>d.items.forEach(it=>{if(it.bk&&!BKI[it.bk])BKI[it.bk]={day:di,id:it.id}}));
const menuEl=()=>$('#menu');
let viewKind='';
function refreshBook(){if(viewKind==='book'&&!$('#view').hidden){const y=$('#view').scrollTop;$('#vbody').innerHTML=bookHtml();$('#view').scrollTop=y}}
function openView(kind,anchor){viewKind=kind;
  const v=$('#view');$('#vt').textContent=kind==='check'?'✅ 出發前清單':'📋 已預訂';
  $('#vbody').innerHTML=kind==='check'?checkHtml():bookHtml();
  v.hidden=false;document.body.style.overflow='hidden';v.scrollTop=0;menuEl().hidden=true;
  if(anchor){const el=document.getElementById('bk-'+anchor);if(el){el.scrollIntoView({block:'start'});v.scrollTop-=60;el.classList.add('flash')}}
}
function closeView(){viewKind='';$('#view').hidden=true;document.body.style.overflow=''}
function checkHtml(){
  let n=0,t=0,h='';
  CHECK.forEach((g,gi)=>{h+=`<div class="cg">${esc(g.g)}</div>`;g.l.forEach((x,i)=>{const id='cl:'+gi+'-'+i,on=store.get(id)==='1';t++;if(on)n++;
    h+=`<button class="cl ${on?'on':''}" data-cl="${id}"><i>✓</i><span>${esc(x)}</span></button>`})});
  return `<div class="vn">已完成 ${n}/${t}　（這是建議清單，可在 index.html 的 CHECK 自行增減）</div>`+h;
}
function bookHtml(){
  return `<div class="vn">共 ${BK.length} 筆。下方可記錄訂位代號、人數、電話，只存在這支手機。</div>`+BK.map(b=>{
    const r=BKI[b.id];
    return `<div class="bkc" id="bk-${b.id}"><div class="bt">${b.ic} ${esc(b.t)}</div><div class="bw">${esc(b.when)}</div>
    <ul>${b.info.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${b.dyn?dynHtml():''}
    <textarea data-note="${b.id}" placeholder="訂位代號、人數、電話…">${esc(store.get('note:'+b.id)||'')}</textarea>
    <div class="acts">${b.q?`<a href="${mapUrl(b.q)}" target="_blank" rel="noopener">📍 Google 地圖</a>`:''}${r?`<button data-goto="${b.id}">↩︎ 回到行程</button>`:''}</div></div>`}).join('');
}
function gotoItem(id){
  const r=BKI[id];if(!r)return;closeView();cur=r.day;render();
  const el=document.querySelector(`[data-iid="${r.id}"],[data-undo="${r.id}"]`);
  if(el){el.scrollIntoView({block:'center'});el.classList.add('flash')}else scrollTo(0,0);
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');
  if(!e.target.closest('#menu,[data-menu]'))menuEl().hidden=true;
  if(!t)return;
  if('menu' in t.dataset){const m=menuEl();m.hidden=!m.hidden;const r=t.getBoundingClientRect();m.style.top=(r.bottom+6)+'px'}
  else if(t.dataset.m==='notif'){menuEl().hidden=true;askNotif()}
  else if(t.dataset.m)openView(t.dataset.m);
  else if(t.dataset.bk)openView('book',t.dataset.bk);
  else if(t.id==='vback')closeView();
  else if(t.dataset.goto)gotoItem(t.dataset.goto);
  else if(t.dataset.cl){const k=t.dataset.cl;store.get(k)==='1'?store.del(k):store.set(k,'1');
    const y=$('#view').scrollTop;$('#vbody').innerHTML=checkHtml();$('#view').scrollTop=y}
});
document.addEventListener('input',e=>{const n=e.target.dataset&&e.target.dataset.note;if(n)store.set('note:'+n,e.target.value)});
/* ---- 提醒：各項目自己的提前分鐘數（rem） ---- */
const HOUR=3600e3;
function allTimed(){return DAYS.flatMap(d=>d.items.filter(i=>i.rem&&i.ts))}
async function notify(it){
  const body=(it.at||'')+' '+it.title;
  try{const reg=await navigator.serviceWorker.getRegistration();
    if(Notification.permission==='granted'){reg?reg.showNotification('⏰ '+it.rem+' 分鐘後：'+it.title,{body,icon:'icon-192.png',tag:it.id}):new Notification('⏰ '+it.rem+' 分鐘後：'+it.title,{body})}}catch(e){}
}
function checkReminders(){
  const now=Date.now(),box=$('#alerts')||$('#mapalert');let h='';
  allTimed().forEach(it=>{
    if(isDone(it.id))return;
    if(now>=it.ts-it.rem*60e3&&now<it.ts+30*60e3){
      const mins=Math.round((it.ts-now)/60e3);
      h+=`<div class="alert">⏰ ${mins>0?mins+' 分鐘後':'現在'}｜${it.at} ${esc(it.title)}</div>`;
      if(!store.get('n:'+it.id)){store.set('n:'+it.id,'1');notify(it)}
    }
  });
  if(box)box.innerHTML=h;
}
setInterval(checkReminders,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update())}});
async function askNotif(){
  if(!('Notification' in window)){alert('此瀏覽器不支援通知。請先「加入主畫面」，用主畫面圖示開啟（需 iOS 16.4 以上）。\n\n最穩的做法：按下方「📅 匯出行事曆」，由 iPhone 行事曆依各項設定提前提醒。');return}
  const p=await Notification.requestPermission();
  alert(p==='granted'?'已開啟。App 開啟/背景執行時會依各項設定提前提醒。\n若要 App 關閉時也提醒，請同時匯入行事曆。':'未允許通知，請到 iPhone 設定 > 通知 開啟，或改用行事曆提醒。');
}

/* ---- 匯出 .ics（每個有提醒的項目依各自設定附提醒） ---- */
function exportIcs(){
  const f=t=>new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//tokyo-trip//ZH\r\nCALSCALE:GREGORIAN\r\n';
  allTimed().forEach(it=>{
    s+=`BEGIN:VEVENT\r\nUID:${it.id.replace('#','-')}@tokyo-trip\r\nDTSTAMP:${f(Date.now())}\r\nDTSTART:${f(it.ts)}\r\nDTEND:${f(it.ts+30*60e3)}\r\nSUMMARY:${(it.title+(it.sub?'｜'+it.sub:'')).replace(/[,;\n]/g,' ')}\r\n`;
    if(it.q)s+=`LOCATION:${it.q.replace(/[,;\n]/g,' ')}\r\nURL:${mapUrl(it.q)}\r\n`;
    s+='BEGIN:VALARM\r\nTRIGGER:-PT'+it.rem+'M\r\nACTION:DISPLAY\r\nDESCRIPTION:'+it.rem+'分鐘後\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  s+='END:VCALENDAR';
  const url=URL.createObjectURL(new Blob([s],{type:'text/calendar'}));
  const a=document.createElement('a');a.href=url;a.download='tokyo-trip.ics';document.body.appendChild(a);a.click();
  setTimeout(()=>a.remove(),500);
  setTimeout(()=>alert('若沒有跳出「加入行事曆」，請改用 Safari 開啟本網址再按一次。'),800);
}

/* ---- 自動更新：Service Worker 網路優先，有新版自動重載 ---- */
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
}
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden)hiddenAt=Date.now();else if(hiddenAt&&Date.now()-hiddenAt>5*60e3)startLive()});
startLive();
</script>
