<style>
:root{--bg:#eaf5fc;--card:#ffffff;--tx:#23344d;--sub:#6a7c93;--line:#d3e5f3;--ac:#f0689a;--acrgb:240,104,154;--green:#2e9e5b;--blue:#0a6cff;--warn:#fff3d6;--warntx:#7a5200;--shadow:0 4px 14px rgba(60,120,180,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1a2b;--card:#162538;--tx:#eaf3ff;--sub:#93a8c4;--line:#25384f;--blue:#6db0ff;--warn:#3a2f10;--warntx:#ffd98a;--shadow:0 4px 14px rgba(0,0,0,.35)}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
body{background:var(--bg) linear-gradient(180deg,rgba(120,190,240,.28),rgba(120,190,240,0) 420px) no-repeat}
.banner{position:relative;width:100%;aspect-ratio:900/338;background:url(banner.jpg) center/cover no-repeat;border-radius:0 0 26px 26px;box-shadow:var(--shadow)}
.iconbtn{position:absolute;right:12px;top:10px;border:0;background:rgba(255,255,255,.85);color:#23344d;width:40px;height:40px;border-radius:20px;font-size:18px;backdrop-filter:blur(6px)}
.tabs{position:sticky;top:0;z-index:10;display:flex;gap:8px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;background:linear-gradient(var(--bg) 78%,rgba(0,0,0,0))}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:2px solid var(--c);border-radius:18px;background:var(--card);color:var(--tx);padding:6px 12px;min-width:84px;text-align:center;line-height:1.25;font-weight:700;font-size:15px}
.tab small{display:block;color:var(--sub);font-size:11px;font-weight:500}
.tab.on{background:var(--c);color:#fff;box-shadow:0 3px 10px rgba(var(--r),.45)}.tab.on small{color:rgba(255,255,255,.9)}
main{padding:4px 16px calc(40px + env(safe-area-inset-bottom,0))}
.dayhead{margin:6px 2px 10px}
.dd{font:700 30px/1.1 "Snell Roundhand","Noteworthy","Chalkboard SE",cursive,sans-serif;color:var(--ac)}
.em{font-size:24px;margin-left:6px}
.dn{font-size:19px;font-weight:700;margin-top:2px}
.meta2{color:var(--sub);font-size:13px;margin-top:2px}
.bar{height:8px;border-radius:4px;background:rgba(var(--acrgb),.18);overflow:hidden;margin:8px 0 12px}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px;width:0;transition:width .3s}
.alert{background:var(--warn);color:var(--warntx);border-radius:16px;padding:10px 14px;margin-bottom:10px;font-size:15px;font-weight:600}
.sec{display:inline-block;margin:18px 0 6px;padding:5px 14px;border-radius:16px;background:rgba(var(--acrgb),.16);color:var(--ac);font-size:14px;font-weight:700}
.walk{margin:2px 0 2px 24px;padding-left:14px;border-left:2px dashed rgba(var(--acrgb),.45);color:var(--sub);font-size:13px;line-height:26px}
.card{display:flex;gap:12px;background:var(--card);border:2px solid transparent;border-radius:22px;padding:12px;margin:8px 0;box-shadow:var(--shadow)}
.card.next{border-color:var(--ac);box-shadow:0 4px 16px rgba(var(--acrgb),.35)}
.chk{flex:0 0 44px;width:44px;height:44px;border-radius:22px;border:2.5px solid var(--ac);background:transparent;color:transparent;font-size:22px;font-weight:700}
.chk:active{background:var(--ac);color:#fff}
.body{flex:1;min-width:0}
.meal{display:inline-block;font-size:12px;font-weight:700;color:var(--ac);background:rgba(var(--acrgb),.14);border-radius:10px;padding:2px 9px;margin-right:4px;white-space:nowrap}
.r1:empty,.r1:not(:has(span)){display:none}
.time{font-weight:800;color:var(--ac);font-variant-numeric:tabular-nums;margin-right:6px}
.badge{font-size:12px;font-weight:700;background:var(--ac);color:#fff;border-radius:10px;padding:2px 9px;margin-right:4px;white-space:nowrap}
.title{font-weight:700;font-size:17px;margin-top:2px;word-break:break-word}
.sub,.hrs{color:var(--sub);font-size:14px}
.lines{margin:4px 0;font-size:14px}.lines div{padding:1px 0}
.meta{color:var(--sub);font-size:13px;margin-top:2px}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts a,.acts button{border:0;border-radius:14px;background:rgba(var(--acrgb),.14);color:var(--ac);padding:9px 14px;font-size:15px;font-weight:700;text-decoration:none;min-height:40px}
.donerow{display:flex;gap:10px;align-items:center;margin:4px 0;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.4);border:1.5px dashed var(--line);color:var(--sub);font-size:14px;width:100%;text-align:left;min-height:40px}
.donerow span:first-child{color:var(--green);font-weight:800}
.notes{margin-top:22px}
details{background:var(--card);border-radius:18px;padding:10px 14px;margin:8px 0;box-shadow:var(--shadow)}
summary{font-weight:700;color:var(--ac)}
details div{white-space:pre-line;font-size:14px;color:var(--sub);margin-top:6px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.tools button{border:0;border-radius:16px;background:var(--card);color:var(--tx);padding:11px 14px;font-size:14px;min-height:44px;box-shadow:var(--shadow)}
.empty{text-align:center;color:var(--ac);padding:26px 0;font-weight:700}
.bye{text-align:center;margin-top:26px;font:700 24px "Snell Roundhand","Noteworthy",cursive;color:var(--ac);opacity:.85}
</style>
</head>

/* ============ 程式區 ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const enc=encodeURIComponent;
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const tsOf=(day,it)=>{const[y,m,d]=(it.date||day.d).split('-').map(Number);const[h,mi]=it.at.split(':').map(Number);return Date.UTC(y,m-1,d,h-(it.tz??9),mi)};
DAYS.forEach(d=>d.items.forEach((it,i)=>{it.id=d.d+'#'+i;if(it.at)it.ts=tsOf(d,it)}));
const mapUrl=q=>'https://www.google.com/maps/search/?api=1&query='+enc(q);
const dirUrl=(a,b)=>'https://www.google.com/maps/dir/?api=1&origin='+enc(a)+'&destination='+enc(b)+'&travelmode=transit';
const isDone=id=>store.get('done:'+id)==='1';
let cur=0,hideDone=store.get('hide')==='1';
(function pick(){const t=new Date(),s=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const i=DAYS.findIndex(d=>d.d===s);cur=i>=0?i:(s>DAYS[DAYS.length-1].d?DAYS.length-1:0)})();

function renderTabs(){
  $('#tabs').innerHTML=DAYS.map((d,i)=>{const[,m,dd]=d.d.split('-');
    return `<button class="tab ${i===cur?'on':''}" data-i="${i}" style="--c:${d.c};--r:${d.rgb}">${+m}/${+dd}（${d.wd}）<small>${d.em} ${esc(d.name.split('・')[0])}</small></button>`}).join('');
  const on=$('.tab.on');if(on)on.scrollIntoView({inline:'center',block:'nearest'});
}
function actions(it){let a='';
  if(it.dir)a+=`<a href="${dirUrl(it.dir[0],it.dir[1])}" target="_blank" rel="noopener">🚉 路線</a>`;
  if(it.q)a+=`<a href="${mapUrl(it.q)}" target="_blank" rel="noopener">📍 Google 地圖</a>`;
  return a?`<div class="acts">${a}</div>`:''}
function render(){
  const day=DAYS[cur];renderTabs();const R=document.documentElement.style;R.setProperty('--ac',day.c);R.setProperty('--acrgb',day.rgb);const tc=document.querySelector('meta[name=theme-color]');if(tc)tc.content=day.c;
  const cards=day.items.filter(i=>i.k==='place'||i.k==='move');
  const done=cards.filter(i=>isDone(i.id)).length;
  const nextId=(cards.find(i=>!isDone(i.id))||{}).id;
  const[,mm,dd2]=day.d.split('-');
  let h=`<div class="dayhead"><div><span class="dd">${+mm}/${+dd2}（${day.wd}）</span><span class="em">${day.em}</span></div><div class="dn">${esc(day.name)}</div><div class="meta2">出發 ${day.start}｜完成 ${done}/${cards.length}</div></div><div class="bar"><i style="width:${cards.length?done/cards.length*100:0}%"></i></div><div id="alerts"></div>`;
  day.items.forEach(it=>{
    if(it.k==='sec'){h+=`<div class="sec">${esc(it.t)}</div>`;return}
    if(it.k==='walk'){h+=`<div class="walk">🚶 步行 ${it.m} 分鐘</div>`;return}
    if(isDone(it.id)){if(!hideDone)h+=`<button class="donerow" data-undo="${it.id}"><span>✓</span><span style="text-decoration:line-through">${it.at?it.at+'　':''}${esc(it.title)}</span></button>`;return}
    h+=`<div class="card ${it.id===nextId?'next':''}"><button class="chk" data-done="${it.id}" aria-label="完成">✓</button><div class="body">
      <div class="r1">${it.at?'<span class="time">'+it.at+'</span>':''}${it.meal?'<span class="meal">'+({'早餐':'🍳','午餐':'🍱','晚餐':'🍽️'}[it.meal])+' '+it.meal+'</span>':''}${it.res?'<span class="badge">★ 已預約</span>':''}${it.badge&&!it.res?'<span class="badge">★ 重要</span>':''}</div>
      <div class="title">${esc(it.title)}</div>
      ${it.sub?`<div class="sub">${esc(it.sub)}</div>`:''}
      ${it.lines?`<div class="lines">${it.lines.map(l=>`<div>${esc(l)}</div>`).join('')}</div>`:''}
      ${it.hrs?`<div class="hrs">🕘 ${esc(it.hrs)}</div>`:''}
      ${it.cost||it.dur?`<div class="meta">${[it.cost,it.dur].filter(Boolean).map(esc).join('｜')}</div>`:''}
      ${it.note?`<div class="meta">📝 ${esc(it.note)}</div>`:''}
      ${actions(it)}</div></div>`;
  });
  if(done===cards.length&&cards.length)h+='<div class="empty">🎉 今天的行程都完成了！</div>';
  if(day.notes.length)h+='<div class="notes">'+day.notes.map(n=>`<details><summary>${esc(n.h)}</summary><div>${esc(n.l)}</div></details>`).join('')+'</div>';
  h+=`<div class="tools"><button id="tHide">${hideDone?'顯示已完成':'隱藏已完成'}</button><button id="tIcs">📅 匯出行事曆（提前1小時提醒）</button><button id="tReset">重置本日勾選</button></div>`;
  h+='<div class="bye">'+(cur===DAYS.length-1?'Goodbye, Tokyo! ♡':"Let's go! ♡")+'</div>';
  $('#main').innerHTML=h;checkReminders();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.i!==undefined){cur=+t.dataset.i;render();scrollTo(0,0)}
  else if(t.dataset.done){store.set('done:'+t.dataset.done,'1');render()}
  else if(t.dataset.undo){store.del('done:'+t.dataset.undo);render()}
  else if(t.id==='tHide'){hideDone=!hideDone;store.set('hide',hideDone?'1':'0');render()}
  else if(t.id==='tReset'){if(confirm('清除本日所有完成勾選？')){DAYS[cur].items.forEach(i=>store.del('done:'+i.id));render()}}
  else if(t.id==='tIcs')exportIcs();
  else if(t.id==='bell')askNotif();
});

/* ---- 提醒：事件前 1 小時 ---- */
const HOUR=3600e3;
function allTimed(){return DAYS.flatMap(d=>d.items.filter(i=>i.rem&&i.ts))}
async function notify(it){
  const body=(it.at||'')+' '+it.title;
  try{const reg=await navigator.serviceWorker.getRegistration();
    if(Notification.permission==='granted'){reg?reg.showNotification('⏰ 1小時後：'+it.title,{body,icon:'icon-192.png',tag:it.id}):new Notification('⏰ 1小時後：'+it.title,{body})}}catch(e){}
}
function checkReminders(){
  const now=Date.now(),box=$('#alerts');let h='';
  allTimed().forEach(it=>{
    if(isDone(it.id))return;
    if(now>=it.ts-HOUR&&now<it.ts+30*60e3){
      const mins=Math.round((it.ts-now)/60e3);
      h+=`<div class="alert">⏰ ${mins>0?mins+' 分鐘後':'現在'}｜${it.at} ${esc(it.title)}</div>`;
      if(!store.get('n:'+it.id)){store.set('n:'+it.id,'1');notify(it)}
    }
  });
  if(box)box.innerHTML=h;
}
setInterval(checkReminders,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){checkReminders();navigator.serviceWorker&&navigator.serviceWorker.getRegistration().then(r=>r&&r.update())}});
async function askNotif(){
  if(!('Notification' in window)){alert('此瀏覽器不支援通知。請先「加入主畫面」，用主畫面圖示開啟（需 iOS 16.4 以上）。\n\n最穩的做法：按下方「📅 匯出行事曆」，由 iPhone 行事曆在事件前 1 小時提醒。');return}
  const p=await Notification.requestPermission();
  alert(p==='granted'?'已開啟。App 開啟/背景執行時會在事件前 1 小時提醒。\n若要 App 關閉時也提醒，請同時匯入行事曆。':'未允許通知，請到 iPhone 設定 > 通知 開啟，或改用行事曆提醒。');
}

/* ---- 匯出 .ics（每個有時間的項目都附「前1小時」提醒） ---- */
function exportIcs(){
  const f=t=>new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  let s='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//tokyo-trip//ZH\r\nCALSCALE:GREGORIAN\r\n';
  allTimed().forEach(it=>{
    s+=`BEGIN:VEVENT\r\nUID:${it.id.replace('#','-')}@tokyo-trip\r\nDTSTAMP:${f(Date.now())}\r\nDTSTART:${f(it.ts)}\r\nDTEND:${f(it.ts+30*60e3)}\r\nSUMMARY:${(it.title+(it.sub?'｜'+it.sub:'')).replace(/[,;\n]/g,' ')}\r\n`;
    if(it.q)s+=`LOCATION:${it.q.replace(/[,;\n]/g,' ')}\r\nURL:${mapUrl(it.q)}\r\n`;
    s+='BEGIN:VALARM\r\nTRIGGER:-PT1H\r\nACTION:DISPLAY\r\nDESCRIPTION:1小時後\r\nEND:VALARM\r\nEND:VEVENT\r\n';
  });
  s+='END:VCALENDAR';
  const url=URL.createObjectURL(new Blob([s],{type:'text/calendar'}));
  const a=document.createElement('a');a.href=url;a.download='tokyo-trip.ics';document.body.appendChild(a);a.click();
  setTimeout(()=>a.remove(),500);
  setTimeout(()=>alert('若沒有跳出「加入行事曆」，請改用 Safari 開啟本網址再按一次。'),800);
}

/* ---- 自動更新：Service Worker 網路優先，有新版自動重載 ---- */
if('serviceWorker' in navigator){
  const had=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!reloaded){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{});
}
render();
</script>
