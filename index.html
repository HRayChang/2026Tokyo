<script>
/* 依裝置當地時間切換主題：17:00～隔天 05:00 深色，其餘淺色（改 DARK_FROM / DARK_TO 即可調整） */
const DARK_FROM=17,DARK_TO=5;
function applyTheme(){const h=new Date().getHours(),d=h>=DARK_FROM||h<DARK_TO,r=document.documentElement;
  if(r.classList.contains('dark')!==d){r.classList.toggle('dark',d);const mv=document.getElementById('mapview');if(mv)mv.classList.toggle('dk',d)}}
function syncTC(){const tc=document.querySelector('meta[name=theme-color]'),v=getComputedStyle(document.documentElement).getPropertyValue('--tc').trim();if(tc&&v)tc.content=v}
applyTheme();syncTC();setInterval(()=>{applyTheme();syncTC()},60000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){applyTheme();syncTC()}});
</script>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
body{background:var(--bg) linear-gradient(180deg,rgba(120,190,240,.28),rgba(120,190,240,0) 420px) no-repeat}

.iconbtn{position:absolute;right:12px;top:10px;border:0;background:rgba(255,255,255,.85);color:#23344d;width:40px;height:40px;border-radius:20px;font-size:18px;backdrop-filter:blur(6px)}

.tab{flex:0 0 auto;border:2px solid var(--c);border-radius:18px;background:var(--card);color:var(--tx);padding:6px 12px;min-width:84px;text-align:center;line-height:1.25;font-weight:700;font-size:15px}

.body{flex:1;min-width:0}
.meal{display:inline-block;font-size:12px;font-weight:700;color:var(--ac);background:rgba(var(--acrgb),.14);border-radius:10px;padding:2px 9px;margin-right:4px;white-space:nowrap}

body.mapmode{overflow:hidden;height:100dvh}

.mapview{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--bg)}

.pps{max-height:42vh;overflow-y:auto}
.ph{font-weight:800;color:var(--ac);margin-bottom:6px}
.pp{padding:8px 0;border-bottom:1px solid var(--line)}.pp:last-child{border:0}
.pp.dn .title{text-decoration:line-through;opacity:.6}
.pp .title{font-size:16px}

.srow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}

.srow.cu{background:rgba(46,158,91,.12);border-radius:12px}
.sn{flex:0 0 28px;height:28px;border-radius:14px;background:var(--c);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.sm{flex:1;min-width:0}.st{font-weight:700;font-size:15px}.st em{font-style:normal;color:var(--ac);margin-right:6px}

function ensureLeaflet(){
  if(window.L)return Promise.resolve();if(lfp)return lfp;
  lfp=new Promise((ok,no)=>{const l=document.createElement('link');l.rel='stylesheet';l.href=LF_CSS;document.head.appendChild(l);
    const sc=document.createElement('script');sc.src=LF_JS;sc.onload=ok;sc.onerror=()=>{lfp=null;no()};document.head.appendChild(sc)});

const dc=()=>getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()||'#e5709a';

function dayModel(day){
  const groups=[],by={},edges=[],rows=[];let prev=null,mv=false,mvs=[];
  /* 每天地圖的 1 號點都從飯店開始 */
  const HLL=LL['Season Hotel 押上'],first=day.d===DAYS[0].d;
  let seenHotel=true; /* 第一天維持原本：從機場接送點開始 */
  if(!first){
    const fk={id:'hotelstart:'+day.d,k:'place',title:'🏨 從飯店出發',sub:HOTEL,q:'Season Hotel 押上',ll:HLL,gn:'飯店・押上'};
    const g=by[HLL.join(',')]={key:HLL.join(','),ll:HLL,items:[fk],n:1,name:'飯店・押上'};groups.push(g);rows.push({it:fk,g});prev=g;
  }
  day.items.forEach(it=>{
    if(it.k==='move'){mv=true;mvs.push(it);return}
    if(it.k!=='place')return;
    /* 第一天：飯店（寄放行李）之前的機場／航班不上地圖，讓 1 號點是飯店 */
    if(!seenHotel){if(it.bk==='hotel')seenHotel=true;else{rows.push({it,g:null});return}}
    if(!it.ll){rows.push({it,g:null});return}
    const key=it.ll.join(',');let g=by[key];
    if(!g){g=by[key]={key,ll:it.ll,items:[],n:groups.length+1,name:it.gn};groups.push(g)}
    g.items.push(it);rows.push({it,g});
    if(prev&&prev!==g)edges.push({a:prev,b:g,t:mv,rt:mvs.length>0&&mvs.every(m=>RT[m.rt])});
    prev=g;mv=false;mvs=[];
  });
  return {groups,edges,rows};
}

    <div class="acts">${it.nolink?'':`<a href="https://www.google.com/maps/dir/?api=1&destination=${enc(it.q)}&travelmode=transit" target="_blank" rel="noopener">🧭 導航</a><a href="${mapUrl(it.q)}" target="_blank" rel="noopener">📍 地圖</a>`}${it.bk?`<button data-bk="${it.bk}">🎟️ 預訂</button>`:''}<button data-${d?'undo':'done'}="${it.id}">${d?'↩︎ 取消完成':'✓ 完成'}</button></div></div>`}).join('')+'</div>';
}

let mapRtB={},mapRtP={};
function drawRoutes(day){
  mapRtB={};mapRtP={};
  day.items.forEach(it=>{
    const legs=it.k==='move'&&RT[it.rt];if(!legs)return;
    const all=[],done=isDone(it.id);let prevEnd=null;
    legs.forEach(lg=>{
      const pts=lg.s.map(p=>[p[0],p[1]]);all.push(...pts);
      if(prevEnd&&dist(prevEnd[0],prevEnd[1],pts[0][0],pts[0][1])>40)
        L.polyline([prevEnd,pts[0]],{color:'#a58fc7',weight:3,opacity:.9,dashArray:'2 7',interactive:false}).addTo(mapLayer);
      L.polyline(pts,{color:'#fff',weight:9,opacity:done?.5:.95,lineCap:'round',lineJoin:'round',interactive:false}).addTo(mapLayer);
      const pl=L.polyline(pts,{color:lg.c,weight:5,opacity:done?.45:.95,lineCap:'round',lineJoin:'round'}).addTo(mapLayer);
      pl.bindPopup(`<div class="ph" style="color:${lg.c}">${esc(lg.n)}</div><div style="font-weight:700">${esc(lg.a)} ➜ ${esc(lg.b)}</div><div class="meta">${lg.s.length-1} 站${it.at?'｜'+it.at+' 發':''}${it.dur?'｜'+(legs.length>1?'全程 ':'')+esc(it.dur):''}${it.cost?'｜'+esc(it.cost):''}</div>`);
      lg.s.forEach((q,i)=>{const end=i===0||i===lg.s.length-1;
        L.circleMarker([q[0],q[1]],{radius:end?6:3.5,color:lg.c,weight:end?4:2.5,fillColor:'#fff',fillOpacity:1}).addTo(mapLayer)
          .bindTooltip(esc(q[2]),end?{permanent:true,direction:'top',offset:[0,-6],className:'rtt'}:{direction:'top',offset:[0,-4],className:'rtt'})});
      if(!mapRtP[it.id])mapRtP[it.id]=pl;
      prevEnd=pts[pts.length-1];
    });
    mapRtB[it.id]=L.latLngBounds(all);
  });
}
function drawMap(day){
  const M=dayModel(day);mapM=M;mapLayer.clearLayers();mapMarkers={};
  M.edges.forEach(e=>{if(e.rt)return;if(dist(e.a.ll[0],e.a.ll[1],e.b.ll[0],e.b.ll[1])>300000)return;
    L.polyline([e.a.ll,e.b.ll],{color:dc(),weight:e.t?4:3,opacity:.8,dashArray:e.t?null:'6 8'}).addTo(mapLayer)});
  drawRoutes(day);
  M.groups.forEach(g=>{
    const all=g.items.every(i=>isDone(i.id)),now=liveInfo&&g.items.some(i=>i.id===liveInfo.item.id),nx=!liveInfo&&g.items.some(i=>i.id===curNext)&&!all;
    const icon=L.divIcon({className:'',iconSize:[32,32],iconAnchor:[16,16],popupAnchor:[0,-18],
      html:`<div class="pin ${all?'done':''} ${now?'now':''} ${nx?'nx':''}" style="--c:${dc()}">${all?'✓':g.n}${g.items.length>1?`<b>${g.items.length}</b>`:''}</div>`});
    const mk=L.marker(g.ll,{icon,zIndexOffset:now?1000:all?-100:0}).addTo(mapLayer);
    mk.bindPopup(popupHtml(g),{maxWidth:290,autoPanPaddingBottomRight:[10,90],autoPanPaddingTopLeft:[10,64]});
    mapMarkers[g.key]=mk;
  });
  if(loc)L.circleMarker([loc.lat,loc.lng],{radius:8,color:'#fff',weight:3,fillColor:'#0a6cff',fillOpacity:1}).addTo(mapLayer);
}
function fitDay(){
  let pts=mapM.groups.filter(g=>g.ll[0]>30).map(g=>g.ll);
  DAYS[cur].items.forEach(i=>{if(i.k==='move'&&RT[i.rt])RT[i.rt].forEach(l=>l.s.forEach(q=>pts.push([q[0],q[1]])))}); /* 路線經過的車站也納入縮放範圍 */
  if(!pts.length){mapObj.setView([35.68,139.77],11);return}
  /* 離群點（例如成田機場）不納入縮放範圍，避免市區的點擠在一起 */
  const med=a=>[...a].sort((x,y)=>x-y)[Math.floor(a.length/2)],mc=[med(pts.map(p=>p[0])),med(pts.map(p=>p[1]))];
  const near=pts.filter(p=>dist(mc[0],mc[1],p[0],p[1])<25000);if(near.length>=2)pts=near;
  if(pts.length===1){mapObj.setView(pts[0],16);return}

}
function focusItem(id,popup){
  if(!mapObj||!mapM||!id)return;
  if(mapRtB[id]){mapObj.flyToBounds(mapRtB[id],{paddingTopLeft:[24,24],paddingBottomRight:[24,110],maxZoom:15,duration:.6});const pl=mapRtP[id];if(popup&&pl)setTimeout(()=>pl.openPopup(),700);return}
  const g=mapM.groups.find(g=>g.items.some(i=>i.id===id));if(!g)return;
  mapObj.flyTo(g.ll,Math.max(mapObj.getZoom(),16),{duration:.6});
  const mk=mapMarkers[g.key];if(popup&&mk)setTimeout(()=>mk.openPopup(),700);
}
function buildSheet(day){
  const M=mapM||dayModel(day),cards=day.items.filter(i=>i.k==='place'||i.k==='move'),done=cards.filter(i=>isDone(i.id)).length;

  $('#sl').innerHTML=M.rows.map(({it,g})=>{const d=isDone(it.id),cu=liveInfo&&liveInfo.item.id===it.id;
    return `<div class="srow ${d?'dn':''} ${cu?'cu':''}" data-focus="${it.id}"><span class="sn" style="--c:${dc()}">${g?g.n:'–'}</span>
    <div class="sm"><div class="st">${it.at?`<em>${it.at}</em>`:''}${esc(it.title)}</div><div class="ss">${esc(it.hrs||it.sub||'')}</div></div>

}

/* 離線預載：目前這天每個地點周邊的地圖圖磚（之後離線也看得到） */
async function preloadDay(btn){
  const M=dayModel(DAYS[cur]),urls=new Set(),r=(window.devicePixelRatio||1)>1?'@2x':'',base=TILE();
  M.groups.filter(g=>g.ll[0]>30).forEach(g=>{const[la,lo]=g.ll;
    for(let z=12;z<=16;z++){const n=2**z,x=Math.floor((lo+180)/360*n),y=Math.floor((1-Math.log(Math.tan(la*Math.PI/180)+1/Math.cos(la*Math.PI/180))/Math.PI)/2*n),k=z>=14?1:0;
      for(let dx=-k;dx<=k;dx++)for(let dy=-k;dy<=k;dy++){const X=x+dx,Y=y+dy;
        urls.add(base.replace('{s}','abcd'[Math.abs(X+Y)%4]).replace('{z}',z).replace('{x}',X).replace('{y}',Y).replace('{r}',r))}}});
  const list=[...urls];let n=0,ok=0;btn.disabled=true;
  const work=async()=>{while(list.length){const u=list.pop();try{const res=await fetch(u,{mode:'cors'});if(res.ok)ok++}catch(e){}n++;if(n%10===0)btn.textContent=`預載中 ${n}/${n+list.length}`}};
  await Promise.all([work(),work(),work(),work(),work(),work()]);
  btn.textContent=ok?`✓ 已預載 ${ok} 張`:'預載失敗（需網路）';btn.disabled=false;
}

function fxMk(T,W,H){
  const shape=T.shapes[Math.random()*T.shapes.length|0],col=T.cols[Math.random()*T.cols.length|0];
  const s=shape==='lantern'?13+Math.random()*12:9+Math.random()*9;let x,y,vx,vy,g=0;
  if(T.mode==='fall'){x=Math.random()*W;y=-20-Math.random()*H*.55;vx=(Math.random()-.5)*1.2;vy=2.3+Math.random()*2.3}
  else if(T.mode==='rise'){x=Math.random()*W;y=H+20+Math.random()*H*.5;vx=(Math.random()-.5)*.6;vy=-(1.2+Math.random()*1.5)}

const MAPLE=[[0,-1],[.17,-.6],[.48,-.8],[.42,-.28],[.9,-.42],[.68,.02],[.95,.18],[.38,.34],[.44,.62],[.06,.5],[.04,.92]];

function fxStep(p,k){
  p.t+=k;p.r+=p.vr*k;
  if(p.mode==='burst'){p.vy+=p.g*k;p.vx*=Math.pow(.985,k);p.vy*=Math.pow(.992,k);p.x+=p.vx*k;p.y+=p.vy*k}
  else{p.x+=(p.vx+Math.sin(p.t*.04+p.ph)*p.sw)*k;p.y+=p.vy*k}

const tvis=e=>!!e&&e.getClientRects().length>0;

    const r=await fetch(hUrl('pins/'+H.uid),{method:'PUT',body:JSON.stringify(pin)});if(!r.ok)throw new Error('HTTP '+r.status);

/* ---- 即時接收（Firebase 串流） ---- */
function hConnect(force){
  if(!HERE_DB||!hRoom())return;
  hCConnect(force);hMemSync();
  if(H.es&&!force&&H.es.readyState!==2)return;
  try{H.es&&H.es.close()}catch(e){}
  const es=H.es=new EventSource(hUrl('pins'));
  es.addEventListener('put',e=>hEvt(e,false));
  es.addEventListener('patch',e=>hEvt(e,true));
  es.addEventListener('cancel',()=>es.close());
  es.onerror=()=>{if(es.readyState===2)setTimeout(()=>hConnect(),5000)};
}
function hEvt(ev,patch){
  let m;try{m=JSON.parse(ev.data)}catch(e){return}
  const parts=(m.path||'/').split('/').filter(Boolean),d=m.data,first=!H.ready,fresh=[];
  const put=(k,v)=>{const was=H.pins[k];if(v==null)delete H.pins[k];else{H.pins[k]=v;if(k!==H.uid&&!v.w&&hLive(v)&&v.t>H.seen&&(!was||was.t!==v.t))fresh.push([k,v]);else if(k===H.uid&&v.w&&v.w!==H.uid&&H.ready&&hLive(v)&&(!was||was.t!==v.t))hToast('👥 '+((H.mem[v.w]&&H.mem[v.w].n)||'夥伴')+' 幫你一起打卡了',v.note||'',H.uid)}};
  if(!parts.length){if(patch)Object.entries(d||{}).forEach(([k,v])=>put(k,v));else{const old=H.pins;H.pins={};Object.entries(d||{}).forEach(([k,v])=>put(k,v))}}
  else if(parts.length===1){if(patch&&d&&H.pins[parts[0]])put(parts[0],{...H.pins[parts[0]],...d});else put(parts[0],d)}
  else{const k=parts[0];if(H.pins[k]){const v={...H.pins[k]};v[parts[1]]=d;put(k,v)}}
  H.ready=true;
  if(fresh.length){H.seen=Math.max(H.seen,...fresh.map(x=>x[1].t));store.set('h:seen',String(H.seen));fresh.sort((a,b)=>a[1].t-b[1].t).forEach(([k,v])=>hAlert(k,v,first))}
  hUi();
  if(first&&H.focus){const f=H.focus;H.focus='';setTimeout(()=>hFocus(H.pins[f]?f:null),500)}
}

  H.hid=0;hPurge();

    const reg=await navigator.serviceWorker.ready;

    if(!s)s=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:hB64(HERE_VAPID)});
    const r=await fetch(hUrl('subs/'+H.uid),{method:'PUT',body:JSON.stringify({sub:s.toJSON(),t:Date.now()})});
    H.push=r.ok?1:0;hUi();
  }catch(e){GLOG.push('推播：'+(e.message||e))}
}
const _askNotif=askNotif;askNotif=async function(){await _askNotif();await hSub();hUi()};
if('serviceWorker' in navigator)navigator.serviceWorker.addEventListener('message',e=>{const m=e.data;if(m&&m.call){H.cHide=0;H.cShow='';hCheck()}else if(m&&m.imhere)hFocus(m.imhere)});

/* ============ 📣 呼叫大家 I'm here ============
   有人發出呼叫 → 同群組的人收到推播，點開是全螢幕「📣 某某在問：…」；App 開著時震動＋提示音，直到你決定回報或先不回報。
   資料：/imhere/rooms/<群組>/calls/<呼叫id>（只有知道群組代碼的人讀得到，與打卡相同的安全措施）。
   發呼叫時若附位置，會用「我的打卡」（同一個 id，一筆，有就覆蓋、沒有就新增）標在地圖上，並加上 c＝呼叫id。
   回報＝照原本的 I'm here 打卡（GPS 或錨點）；回報結果整理在「I'm here」頁面的 📣 區塊。 */
const HERE_CALLQ=['你們在哪？','集合囉，在哪？'];
const hCLive=c=>!!c&&typeof c.t==='number'&&typeof c.m==='string'&&typeof c.by==='string'&&Date.now()-c.t<HERE_TTL;
const hCDone=()=>{try{const a=JSON.parse(store.get('h:cd')||'[]');return Array.isArray(a)?a:[]}catch(e){return[]}};
function hCMark(id){const a=hCDone();if(!a.includes(id)){a.push(id);store.set('h:cd',JSON.stringify(a.slice(-30)))}}
const hCAll=()=>Object.entries(H.calls).map(([id,c])=>({id,...c})).filter(hCLive).sort((a,b)=>b.t-a.t);
function hCPend(){   /* 等我決定的呼叫：還沒過期、不是我發的、加入群組之後發的、我沒按過「先不回報」、也還沒回報 */
  const me=H.pins[H.uid],dn=hCDone(),cj=+(store.get('h:cj')||0);
  return hCAll().filter(c=>c.by!==H.uid&&c.t>=cj&&!dn.includes(c.id)&&!(me&&typeof me.t==='number'&&me.t>=c.t));
}

/* ---- 震動＋提示音（App 開著且在前景時重複，直到決定為止；iOS 不支援網頁震動，且需先點過畫面才允許出聲） ---- */
let hAC=null,hAT=0;
function hAudio(){try{if(!hAC){const A=window.AudioContext||window.webkitAudioContext;if(A)hAC=new A()}if(hAC&&hAC.state==='suspended')hAC.resume()}catch(e){}return hAC}
['pointerdown','touchend','keydown'].forEach(ev=>addEventListener(ev,()=>hAudio(),{passive:true}));
function hBeep(){const a=hAudio();if(!a||a.state!=='running')return;const t0=a.currentTime;
  [880,1175,880].forEach((f,i)=>{const o=a.createOscillator(),g=a.createGain(),s=t0+i*.24;o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(0.0001,s);g.gain.linearRampToValueAtTime(.35,s+.02);g.gain.exponentialRampToValueAtTime(.001,s+.21);
    o.connect(g);g.connect(a.destination);o.start(s);o.stop(s+.23)})}
function hRing(){if(document.hidden)return;hBeep();try{navigator.vibrate&&navigator.vibrate([300,120,300,120,300])}catch(e){}}
function hAlarm(on){clearInterval(hAT);hAT=0;try{navigator.vibrate&&navigator.vibrate(0)}catch(e){}if(on){hRing();hAT=setInterval(hRing,3000)}}

/* ---- 收到呼叫：全螢幕畫面＋待回報小膠囊 ---- */
function hCheck(){
  if(!H.ready||!hRoom())return;
  const L=hCPend(),top=L[0];
  if(!top){H.cShow='';H.cHide=0;hAlarm(0);hCOv(null);hCPill(null);return}
  if(H.cShow!==top.id){H.cShow=top.id;H.cHide=0;hAlarm(1);if(document.hidden)hSysCall(top)}
  hCOv(top);hCPill(top,L.length);
}
function hCOv(c){
  let o=$('#hcall');
  if(!c||H.cHide){if(o)o.remove();return}
  const pin=H.pins[c.by],spot=!!(c.l&&hLive(pin)),key=c.id+'|'+(spot?1:0);
  if(o&&o.dataset.k===key)return;
  if(!o){o=document.createElement('div');o.id='hcall';o.className='hcall';o.setAttribute('role','alertdialog');document.body.appendChild(o)}
  o.dataset.k=key;
  o.innerHTML=`<div class="hcb"><div class="hcr">📣</div>
    <div class="hcw">${esc(c.n||'旅伴')} 在問：</div><div class="hcm">${esc(c.m)}</div>
    <div class="hcs">${hClock(c.t)}｜${hAgo(c.t)}${spot?'｜地圖上已標示集合地':''}</div>
    <button class="hcbtn pri" data-h="crep" data-id="${c.id}">📍 回報我的位置</button>
    <button class="hcbtn" data-h="canc" data-id="${c.id}">📌 用錨點標示位置</button>
    ${spot?`<button class="hcbtn" data-h="cview" data-id="${c.id}">🗺️ 先看集合地（暫停提示音）</button>`:''}
    <button class="hcbtn ghost" data-h="cno" data-id="${c.id}">先不回報</button></div>`;
}
function hCPill(c,n){
  let p=$('#hcpill');
  if(!c||!H.cHide){if(p)p.remove();return}
  if(!p){p=document.createElement('button');p.id='hcpill';p.className='hcpill';p.dataset.h='cshow';document.body.appendChild(p)}
  p.textContent='📣 '+(c.n||'旅伴')+' 在問：'+c.m+(n>1?'（共 '+n+' 則）':'')+'　點此回報';
}
async function hSysCall(c){
  try{if(!('Notification' in window)||Notification.permission!=='granted')return;
    const reg=await navigator.serviceWorker.getRegistration(),ti='📣 '+(c.n||'旅伴')+' 在問：'+c.m,
      o={body:'點開回報你的位置，或選擇先不回報',icon:'icon-192.png',tag:'call:'+c.id,renotify:true,requireInteraction:true,vibrate:[300,150,300,150,300],data:{id:'',call:c.id}};
    reg?reg.showNotification(ti,o):new Notification(ti,o)}catch(e){}
}

/* ---- 即時接收呼叫（Firebase 串流） ---- */
function hCConnect(force){
  if(H.ces&&!force&&H.ces.readyState!==2)return;
  try{H.ces&&H.ces.close()}catch(e){}
  const es=H.ces=new EventSource(hUrl('calls'));
  es.addEventListener('put',e=>hCEvt(e,false));
  es.addEventListener('patch',e=>hCEvt(e,true));
  es.addEventListener('cancel',()=>es.close());
  es.onerror=()=>{if(es.readyState===2)setTimeout(()=>hCConnect(),5000)};
}
function hCEvt(ev,patch){
  let m;try{m=JSON.parse(ev.data)}catch(e){return}
  const parts=(m.path||'/').split('/').filter(Boolean),d=m.data;
  if(!parts.length){
    if(patch)Object.entries(d||{}).forEach(([k,v])=>{if(v==null)delete H.calls[k];else H.calls[k]=v});
    else H.calls=d&&typeof d==='object'?{...d}:{};
  }else if(parts.length===1){
    if(d==null)delete H.calls[parts[0]];else H.calls[parts[0]]=patch&&H.calls[parts[0]]?{...H.calls[parts[0]],...d}:d;
  }else{const v={...(H.calls[parts[0]]||{})};if(d==null)delete v[parts[1]];else v[parts[1]]=d;H.calls[parts[0]]=v}
  hUi();
}

/* ---- 發出呼叫 ---- */
function hCallOpen(){if(hRoom())hCallForm();else{H.cwant=1;hJoin()}}
function hCRead(){
  const d=H.cdraft||(H.cdraft={msg:'',loc:'none'}),m=$('#hcmsg'),n=$('#hname'),r=document.querySelector('input[name=hcloc]:checked');
  if(m)d.msg=m.value.trim().slice(0,24);if(r)d.loc=r.value;
  if(n&&n.value.trim())store.set('g:name',n.value.trim().slice(0,12));

}

  const d=H.cdraft,anc=d.loc==='anchor'&&!!H.man,ck=v=>d.loc===v?'checked':'';
  hDlg(`<h3>📣 呼叫大家 I'm here</h3><div class="gnote" style="margin-bottom:10px">同群組的夥伴會收到推播，點開就是全螢幕通知；每個人可以自己決定要不要回報。</div>
  <input type="text" id="hname" placeholder="暱稱（夥伴會看到）" maxlength="12" value="${esc(hName())}">

  <div class="hcl">
    <label><input type="radio" name="hcloc" value="none" ${ck('none')}> 不附位置</label>
    <label><input type="radio" name="hcloc" value="me" ${ck('me')}> 📍 附上我現在的位置</label>
    <label><input type="radio" name="hcloc" value="anchor" ${ck('anchor')}> 📌 用錨點在地圖上標示集合地${anc?'（已選好 ✅）':''}</label></div>
  <div class="gnote">附位置時，地圖上你的標記會更新（原本有就覆蓋，沒有就新增），顯示 30 分鐘。</div>
  <button class="hgo" data-h="csend">📣 送出呼叫</button>${anc?'<button class="hgo2" data-h="anchor">↩︎ 回地圖重新選位置</button>':''}<button class="hgo2" data-h="close">取消</button>`);
}
function hCFail(r){
  const man=H.cdraft&&H.cdraft.loc==='anchor',b=(k,t,c)=>`<button class="${c||'hgo2'}" data-h="${k}">${t}</button>`;
  let msg;
  if(r.weak!=null)msg=`定位誤差${r.weak>0?'約 '+r.weak+' 公尺':'很大'}（超過 ${HERE_ACC} 公尺），位置可能不可靠。`;
  else if(r.net)msg='連線失敗，呼叫尚未送出。<br><small>原因：'+esc(r.why||'')+'</small>';
  else if(r.err===1)msg='沒有定位權限。請到 iPhone「設定」→ 隱私權與安全性 → 定位服務，允許後再試。';
  else msg='暫時取得不到 GPS。';
  hDlg(`<h3>📣 還沒送出</h3><div class="gnote">${msg}</div>${b('csend2','🔄 再試一次','hgo')}${man||r.net?'':b('canc2','📌 改用錨點選集合地')}${r.net?'':b('cnoloc','不附位置，直接呼叫')}${b('cclose','取消')}`);
}
async function hCallSend(){
  const d=H.cdraft;if(!d)return;
  if(!d.cid)d.cid=rid(10);
  hDlg(d.loc==='me'&&!d.pinned?'<h3>定位中…</h3><div class="hspin"></div><div class="gnote" style="text-align:center">正在取得 GPS（最多 15 秒）</div>':'<h3>送出中…</h3><div class="hspin"></div>');
  if(d.loc!=='none'&&!d.pinned){
    const r=await hCheckin(('📣 '+d.msg).slice(0,30),'',d.loc==='anchor'?H.man:null,d.cid);   /* 先標地圖，夥伴收到呼叫時集合地已就緒 */
    if(!r.ok){hCFail(r);return}
    d.pinned=1;
  }
  const call={by:H.uid,n:hName()||'旅伴',e:hEmo(),m:d.msg,t:Date.now(),l:d.pinned?1:0};
  try{const r=await fetch(hUrl('calls/'+d.cid),{method:'PUT',body:JSON.stringify(call)});if(!r.ok)throw new Error('HTTP '+r.status)}
  catch(e){hCFail({net:1,why:(e&&e.message)||'網路無回應'});return}
  H.calls[d.cid]=call;const pinned=d.pinned;H.cdraft=null;H.man=null;hClose();hUi();
  hToast('📣 已通知大家',pinned?'集合地已標在地圖上':call.m,pinned?H.uid:'');
  if(pinned)hFocus(H.uid);
}

/* ---- 回報結果（I'm here 頁面的 📣 區塊；同群組都看得到） ---- */
function hCallsHtml(){
  const cs=hCAll();

      reps=ls.filter(p=>p.id!==c.by&&p.t>=c.t),replied=reps.some(p=>p.id===H.uid),declined=!mine&&!replied&&dn.includes(c.id);
    const row=(p,lab)=>`<div class="gm"><div class="ge" style="--h:${hHue(p.n)}">${esc(p.e||'🙂')}</div><div class="gi"><b>${lab||(p.id===H.uid?'我':esc(p.n||'旅伴'))}　${hClock(p.t)}</b><small>${p.note?'💬 '+esc(p.note)+'｜':''}${hAgo(p.t)}</small></div><button class="gbtn" data-h="see" data-id="${p.id}">📍</button></div>`;
    return `<div class="hcc"><div style="font-size:15px;font-weight:800">📣 ${esc(mine?'我':c.n||'旅伴')} 在問：${esc(c.m)}</div>

      ${spot?row(cp,'📌 集合地（'+esc(mine?'我':c.n||'旅伴')+'）'):''}
      ${reps.length?`<div class="gnote" style="margin-top:6px">已回報 ${reps.length} 人</div>`+reps.map(p=>row(p)).join(''):'<div class="gnote" style="margin-top:6px">還沒有人回報。</div>'}
      ${(()=>{const ms=hMems().filter(m=>m.id!==c.by&&!reps.some(p=>p.id===m.id));return ms.length?`<div class="gnote" style="margin-top:6px">⏳ 尚未回報 ${ms.length} 人：${ms.map(m=>esc(m.e||'🙂')+esc(m.id===H.uid?'我':m.n)).join('、')}</div>`:''})()}
      <div class="gbtns" style="margin-top:8px">${!mine&&!replied?`<button class="gbtn" data-h="crep" data-id="${c.id}">📍 回報我的位置</button><button class="gbtn" data-h="canc" data-id="${c.id}">📌 錨點回報</button>`:''}${mine?`<button class="gbtn" data-h="cdel" data-id="${c.id}">撤回呼叫</button>`:''}</div></div>`}).join('');
}

/* ---- 呼叫相關按鈕 ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-h]');if(!t)return;const k=t.dataset.h,id=t.dataset.id||H.cShow;
  const away=()=>{if(id===H.cShow){H.cHide=1;hAlarm(0);hCheck()}};   /* 去回報時先收起全螢幕畫面，待回報小膠囊留著 */
  if(k==='callopen'){closeView();hCallOpen()}
  else if(k==='cq'){const m=$('#hcmsg');if(m)m.value=t.dataset.t}

    if(!d.msg){const m=$('#hcmsg');if(m){m.focus();m.placeholder='請輸入一句話'}return}
    if(d.loc==='anchor'&&!H.man){H.cdraft=d;hAnchor();return}
    hCallSend();
  }
  else if(k==='csend2')hCallSend();

  else if(k==='cno'){if(!id)return;hCMark(id);hCheck();hUi()}
  else if(k==='cview'){const c=H.calls[id];away();if(c)hFocus(c.by)}

  else if(k==='cdel'){if(!id||!confirm('撤回這則呼叫？'))return;delete H.calls[id];fetch(hUrl('calls/'+id),{method:'DELETE'}).catch(()=>{});hCheck();hUi()}
  else if(k==='close'){H.cdraft=null;H.cwant=0}
});

/* ---- 👥 群組成員名單（members/<id>：暱稱、頭像、最後上線；用來顯示「尚未回報」） ---- */

    store.set('g:name',nm);H.pend=((o&&o.value)||'').trim().slice(0,30);
    const au=$('#hauto');if(au){if(au.checked){const mi=Math.min(180,Math.max(5,parseInt(($('#hmin')||{}).value)||30)),wk=$('#hwake');hAutoStart({min:mi,note:H.pend,wake:wk&&wk.checked?1:0})}else if(hAutoCfg())hAutoStop()}

  else if(k==='all')hFocus(null);

<script>
/* ============ 🎫 優惠券（只存在這支手機，不上傳） ============
   每張：名稱、店家、到期日、代碼、備註、截圖／條碼照片。資料放 localStorage（清除 Safari 網站資料會一起消失）。 */
const CP={list:[],img:'',cur:null};
function cpLoad(){try{CP.list=JSON.parse(store.get('cp:list')||'[]')||[]}catch(e){CP.list=[]}}
function cpSave(){try{localStorage.setItem('cp:list',JSON.stringify(CP.list));return true}catch(e){return false}}
const cpImg=id=>store.get('cp:i:'+id)||'';
const cpAll=()=>{cpLoad();return[...COUPONS.map(c=>({...c,prov:1,used:store.get('cp:u:'+c.id)==='1'})),...CP.list]};   /* prov＝你提供的 */
const cpFind=id=>cpAll().find(x=>x.id===id);
const cpImgOf=c=>c.prov?(c.img||''):cpImg(c.id);
function cpDays(u){if(!u)return null;const[y,m,d]=u.split('-').map(Number),e=new Date(y,m-1,d),n=new Date();n.setHours(0,0,0,0);return Math.round((e-n)/864e5)}
function cpState(c){
  if(c.used)return{k:'used',t:'已使用'};
  const d=cpDays(c.u);
  if(d==null)return{k:'ok',t:'無期限'};
  if(d<0)return{k:'exp',t:'已過期'};
  if(d===0)return{k:'warn',t:'今天到期'};
  if(d<=3)return{k:'warn',t:'剩 '+d+' 天到期'};
  return{k:'ok',t:c.u.slice(5).replace('-','/')+' 到期（剩 '+d+' 天）'};
}
const cpRank=c=>{const s=cpState(c).k;return(s==='used'||s==='exp')?1:0};
function cpSorted(){return cpAll().sort((a,b)=>cpRank(a)-cpRank(b)||(a.u||'9999').localeCompare(b.u||'9999')||(b.c||0)-(a.c||0))}
async function cpShrink(file){
  const im=await imgDecode(file,1400);let S=1000,q=.75,out='',c=document.createElement('canvas');
  try{for(let i=0;i<5;i++){const k=Math.min(1,S/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
    if(out.length<180000)break;S=Math.round(S*.85);q=Math.max(.5,q-.05)}}
  finally{imgFree(im,c)}
  return out}
function cpCard(c){
  const s=cpState(c),im=cpImgOf(c),show=im||c.k;
  return `<div class="bkc cp ${s.k}"><div class="bt">${c.used?'✅':'🎫'} ${esc(c.t)}${c.prov?' <span class="badge" style="margin-left:4px;vertical-align:middle">🎁 提供</span>':''}</div><div class="bw">${esc(s.t)}${c.s?'｜'+esc(c.s):''}</div>
  ${c.k?`<div class="vn" style="font:700 15px ui-monospace,Menlo,monospace;-webkit-user-select:text;user-select:text;word-break:break-all">${esc(c.k)}</div>`:''}
  ${c.n?`<div class="vn" style="white-space:pre-wrap">${esc(c.n)}</div>`:''}
  ${im?`<img class="cpim" src="${im}" data-cp="show" data-id="${c.id}" alt="">`:''}
  <div class="acts">${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener" style="background:var(--ac);color:#fff">🔗 開啟優惠券頁面</a>`:''}${show?`<button data-cp="show" data-id="${c.id}">🔍 結帳出示</button>`:''}${c.k?`<button data-cp="copy" data-id="${c.id}">📋 複製代碼</button>`:''}
  <button data-cp="used" data-id="${c.id}">${c.used?'↩︎ 取消已使用':'✓ 已使用'}</button>${(c.q||c.s)?`<a href="${mapUrl(c.q||c.s)}" target="_blank" rel="noopener">📍 附近店家</a>`:''}
  ${c.prov?'':`<button data-cp="edit" data-id="${c.id}">✏️ 編輯</button>`}</div></div>`;
}
function cpHtml(){
  cpLoad();const L=cpSorted(),today=L.filter(c=>!c.used&&cpDays(c.u)===0).length;
  return `<div class="vn">共 ${L.length} 張。標示「🎁 提供」的是行程提供的；「已使用」與自己新增的只存在這支手機。</div>${today?`<div class="alert">⏰ 今天有 ${today} 張優惠券到期</div>`:''}

}
function cpRefresh(){if(viewKind==='coupon'&&!$('#view').hidden){const v=$('#view'),y=v.scrollTop;$('#vbody').innerHTML=cpHtml();v.scrollTop=y}}
function cpPhHtml(){return CP.img?`<img class="cpim" src="${CP.img}" alt=""><button class="gbtn" data-cp="unpic">移除圖片</button>`:`<button class="gbtn" data-cp="pick">🖼️ 加入截圖／條碼照片（選填）</button>`}
function cpForm(id){
  cpLoad();const c=id?CP.list.find(x=>x.id===id):null;CP.cur=c?c.id:null;CP.img=c?cpImg(c.id):'';
  hDlg(`<h3>${c?'編輯優惠券':'新增優惠券'}</h3>
  <input type="text" id="cpt" placeholder="名稱，例如：松本清 5% 折價券" maxlength="40" value="${esc(c?c.t:'')}">
  <input type="text" id="cps" placeholder="店家／地點（選填）" maxlength="40" value="${esc(c?c.s||'':'')}">
  <div class="gnote" style="margin:0 0 2px">到期日（選填）</div><input type="date" id="cpu" value="${esc(c?c.u||'':'')}" style="width:100%;border:1.5px solid var(--line);background:transparent;color:var(--tx);border-radius:14px;padding:10px 12px;font:inherit;font-size:16px;margin-bottom:8px">
  <input type="text" id="cpk" placeholder="優惠碼（選填）" maxlength="60" autocapitalize="off" autocomplete="off" value="${esc(c?c.k||'':'')}">
  <input type="text" id="cpn" placeholder="備註（選填），例如：滿 5,000 日圓免稅＋折扣" maxlength="80" value="${esc(c?c.n||'':'')}">
  <div id="cpph" style="margin:0 0 8px">${cpPhHtml()}</div><input type="file" id="cpfile" accept="image/*" hidden>
  <button class="hgo" data-cp="save">儲存</button>${c?'<button class="hgo2" data-cp="del" style="color:#d9534f">刪除這張</button>':''}<button class="hgo2" data-h="close">取消</button>`);
}
function cpShow(id){
  const c=cpFind(id);if(!c)return;const im=cpImgOf(c);
  const d=document.createElement('div');d.className='cplight';
  d.innerHTML=`<b style="font-size:18px">${esc(c.t)}</b>${im?`<img src="${im}" alt="">`:''}${c.k?`<div style="font:800 24px ui-monospace,Menlo,monospace;word-break:break-all">${esc(c.k)}</div>`:''}<div style="color:#777;font-size:13px">點一下關閉</div>`;
  d.onclick=()=>d.remove();document.body.appendChild(d);
}
document.addEventListener('change',e=>{
  if(e.target.id!=='cpfile')return;const f=e.target.files&&e.target.files[0];if(!f)return;
  cpShrink(f).then(d=>{CP.img=d;const b=$('#cpph');if(b)b.innerHTML=cpPhHtml()}).catch(()=>alert('無法讀取這張圖片，請換一張試試'));
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-cp]');if(!t)return;const k=t.dataset.cp,id=t.dataset.id;
  if(k==='new')cpForm(null);
  else if(k==='edit')cpForm(id);
  else if(k==='pick'){const f=$('#cpfile');if(f){f.value='';f.click()}}
  else if(k==='unpic'){CP.img='';const b=$('#cpph');if(b)b.innerHTML=cpPhHtml()}
  else if(k==='show')cpShow(id);
  else if(k==='copy'){const c=cpFind(id);if(c&&navigator.clipboard)navigator.clipboard.writeText(c.k).then(()=>{t.textContent='✓ 已複製';setTimeout(()=>{t.textContent='📋 複製代碼'},1500)}).catch(()=>{})}
  else if(k==='used'){const c=cpFind(id);if(c){if(c.prov){c.used?store.del('cp:u:'+id):store.set('cp:u:'+id,'1')}else{const r=CP.list.find(x=>x.id===id);if(r){r.used=!r.used;cpSave()}}cpRefresh()}}
  else if(k==='del'){if(CP.cur&&confirm('刪除這張優惠券？')){CP.list=CP.list.filter(x=>x.id!==CP.cur);store.del('cp:i:'+CP.cur);cpSave();hClose();cpRefresh()}}
  else if(k==='save'){
    const v=s=>(($(s)||{}).value||'').trim(),title=v('#cpt');
    if(!title){const n=$('#cpt');if(n){n.focus();n.placeholder='請先填名稱'}return}

    if(!ok||!cpSave()){if(isNew)CP.list=CP.list.filter(x=>x!==c);store.del('cp:i:'+c.id);alert('手機儲存空間不足，存不下這張圖片。請移除圖片，或刪掉不用的優惠券再試一次。');return}
    hClose();cpRefresh();
  }
});

addEventListener('load',()=>setTimeout(()=>{if(navigator.onLine)COUPONS.forEach(c=>{if(c.img)fetch(c.img).catch(()=>{})})},3000));
</script>

    var u='https://api.open-meteo.com/v1/forecast?latitude='+ll[0]+'&longitude='+ll[1]+'&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=Asia%2FTokyo&start_date='+d.d+'&end_date='+d.d;
    return fetch(u).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(j){
      var H=j.hourly,D=j.daily;
      WX[d.d]={c:D.weather_code[0],hi:Math.round(D.temperature_2m_max[0]),lo:Math.round(D.temperature_2m_min[0]),p:D.precipitation_probability_max[0]||0,sr:D.sunrise[0].slice(11,16),ss:D.sunset[0].slice(11,16),
        h:H.time.map(function(t,i){return {h:+t.slice(11,13),t:Math.round(H.temperature_2m[i]),a:Math.round(H.apparent_temperature[i]),p:H.precipitation_probability[i]||0,mm:H.precipitation[i]||0,c:H.weather_code[i],w:Math.round(H.wind_speed_10m[i])}})};
      return 1}).catch(function(){return 0});
  })).then(function(r){
    if(r.some(Boolean)){wxT=Date.now();store.set(KEY,JSON.stringify({t:wxT,d:WX}));try{inject()}catch(e){}}
  }).then(function(){loading=null},function(){loading=null});
  return loading;
}
/* ---- 估每個景點的到達時間（沒有指定時間的，用前一個有時間的項目＋步行／停留推算）→ 找出雨天要注意的戶外項目 ---- */
function flags(i){
  var day=DAYS[i],w=WX[day.d],out={};if(!w)return out;
  var t=null;
  for(var n=0;n<day.items.length;n++){var it=day.items[n],ts;
    if(it.k==='walk'){if(t!=null)t+=it.m*6e4;continue}
    if(it.k!=='place'&&it.k!=='move')continue;
    if(it.ts){ts=it.ts;t=ts+(it.k==='place'?30:0)*6e4}else if(t!=null){ts=t;t+=20*6e4}else continue;
    if(it.k!=='place')continue;
    var txt=(it.title||'')+' '+(it.q||''),a=null;
    for(var j=0;j<ALT.length;j++)if(ALT[j][0].test(txt)){a=ALT[j];break}
    if(!a||isDone(it.id)||jstDate(ts)!==day.d)continue;
    var h=jstH(ts),a1=w.h[h],a2=w.h[Math.min(23,h+1)];
    var p=Math.max(a1?a1.p:0,a2?a2.p:0),mm=Math.max(a1?a1.mm:0,a2?a2.mm:0);
    if(p>=50||mm>=1)out[it.id]={h:h,p:p,mm:mm,tip:a[1],title:it.title};
  }
  return out;
}
/* ---- 行程頁：日期標題旁的天氣小標籤＋卡片上的雨天備案 ---- */
function inject(){
  var head=document.querySelector('.dayhead');if(!head)return;
  document.querySelectorAll('.wxchip,.wxb').forEach(function(x){x.remove()});
  var w=WX[DAYS[cur].d];if(!w)return;
  head.insertAdjacentHTML('beforeend','<button class="wxchip" data-wx="'+cur+'">'+ICON[kindOf(w.c)]+' '+w.lo+'–'+w.hi+'°　💧'+w.p+'%　<small>逐時預報 ›</small></button>');
  var fl=flags(cur);
  Object.keys(fl).forEach(function(id){
    var b=document.querySelector('.card[data-iid="'+id+'"] .body');if(!b)return;var f=fl[id];
    b.insertAdjacentHTML('beforeend','<div class="wxb"><b>☔ 約 '+pad(f.h)+':00 降雨機率 '+f.p+'%</b>'+'備案：'+esc(f.tip)+'</div>');
  });
}
var _render=window.render;
window.render=function(){var r=_render.apply(this,arguments);try{inject()}catch(e){}return r};
/* ---- 天氣特效（Canvas）：雨／雷雨／毛毛雨／雪／晴天陽光／夜晚星空流星／雲／霧 ---- */
function sprite(dark){
  var c=document.createElement('canvas');c.width=320;c.height=150;var x=c.getContext('2d');
  [[90,95,52],[150,70,62],[215,92,56],[265,105,38],[55,112,34],[160,110,60]].forEach(function(p){
    var g=x.createRadialGradient(p[0],p[1],0,p[0],p[1],p[2]);
    g.addColorStop(0,dark?'rgba(70,82,104,.95)':'rgba(255,255,255,.95)');g.addColorStop(1,dark?'rgba(70,82,104,0)':'rgba(255,255,255,0)');
    x.fillStyle=g;x.fillRect(0,0,320,150)});
  return c;
}
function fx(cv,k,mm,night){
  var ctx=cv.getContext&&cv.getContext('2d');if(!ctx)return function(){};
  var dpr=Math.min(2,window.devicePixelRatio||1),R=Math.random,W,H;
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}size();
  var rain=k==='rain'||k==='storm'||k==='drizzle',dz=k==='drizzle';
  var drops=rain?Array.from({length:dz?70:k==='storm'?230:mm>=4?210:mm>=1.5?150:110},function(){return {x:R()*(W+160)-80,y:R()*H,l:(dz?7:14)+R()*(dz?8:18),v:(dz?380:720)+R()*480}}):[];
  var flakes=k==='snow'?Array.from({length:100},function(){return {x:R()*W,y:R()*H,r:1.5+R()*3,v:30+R()*55,ph:R()*6.28}}):[];
  var cn={clear:0,partly:4,cloud:7,fog:0,drizzle:6,rain:7,storm:8,snow:5}[k]||0;
  var spr=cn?sprite(rain||night):null;
  var clouds=Array.from({length:cn},function(){return {x:R()*(W+300)-250,y:H*(.03+R()*.4),s:.7+R()*.9,v:5+R()*16,a:.55+R()*.4}});
  var bands=k==='fog'?Array.from({length:6},function(_,i){return {y:H*(.1+i*.14),h:70+R()*60,x:R()*W,v:(i%2?1:-1)*(8+R()*10)}}):[];
  var sunny=!night&&(k==='clear'||k==='partly'),starry=night&&(k==='clear'||k==='partly');
  var stars=starry?Array.from({length:80},function(){return {x:R()*W,y:R()*H*.75,r:.6+R()*1.4,ph:R()*6.28}}):[];
  var spark=k==='clear'&&!night?Array.from({length:26},function(){return {x:R()*W,y:R()*H,r:2+R()*3,ph:R()*6.28,v:6+R()*14}}):[];
  var shoot=null,flash=0,time=0,raf=0,last=0,alive=true;
  function draw(dt){
    time+=dt;ctx.clearRect(0,0,W,H);
    if(starry){stars.forEach(function(s){ctx.fillStyle='rgba(255,255,255,'+(.35+.65*Math.abs(Math.sin(time*1.4+s.ph)))+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.3);ctx.fill()});
      if(!shoot&&R()<dt*.22)shoot={x:W*(.15+R()*.6),y:H*R()*.25,t:0};
      if(shoot){shoot.t+=dt;var px=shoot.x+shoot.t*520,py=shoot.y+shoot.t*280,g=ctx.createLinearGradient(px,py,px-110,py-60);g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(px-110,py-60);ctx.stroke();if(shoot.t>.9)shoot=null}}
    if(sunny){var cx=W*.82,cy=H*.1,pulse=.5+.1*Math.sin(time*1.2),g2=ctx.createRadialGradient(cx,cy,0,cx,cy,300);
      g2.addColorStop(0,'rgba(255,248,205,'+(pulse+.35)+')');g2.addColorStop(.25,'rgba(255,236,160,'+pulse*.55+')');g2.addColorStop(1,'rgba(255,230,150,0)');ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
      ctx.save();ctx.translate(cx,cy);ctx.rotate(time*.12);ctx.fillStyle='rgba(255,246,200,.10)';
      for(var i=0;i<9;i++){ctx.rotate(6.2832/9);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(H*1.2,-26);ctx.lineTo(H*1.2,26);ctx.closePath();ctx.fill()}ctx.restore()}
    spark.forEach(function(s){s.y-=s.v*dt;if(s.y<-10){s.y=H+10;s.x=R()*W}var a=.25+.6*Math.abs(Math.sin(time*2+s.ph));ctx.strokeStyle='rgba(255,255,255,'+a+')';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(s.x-s.r,s.y);ctx.lineTo(s.x+s.r,s.y);ctx.moveTo(s.x,s.y-s.r);ctx.lineTo(s.x,s.y+s.r);ctx.stroke()});
    clouds.forEach(function(c){c.x+=c.v*dt;if(c.x>W+20)c.x=-330*c.s;ctx.globalAlpha=c.a;ctx.drawImage(spr,c.x,c.y,320*c.s,150*c.s)});ctx.globalAlpha=1;
    bands.forEach(function(b){b.x+=b.v*dt;if(b.x>W)b.x=-W;if(b.x<-W*1.2)b.x=W*.2;var g3=ctx.createLinearGradient(b.x,0,b.x+W*1.4,0);g3.addColorStop(0,'rgba(255,255,255,0)');g3.addColorStop(.5,'rgba(255,255,255,.30)');g3.addColorStop(1,'rgba(255,255,255,0)');ctx.fillStyle=g3;ctx.fillRect(b.x,b.y,W*1.4,b.h)});
    if(rain){ctx.strokeStyle=night?'rgba(180,205,240,.5)':'rgba(215,235,255,.6)';ctx.lineWidth=dz?1:1.4;ctx.beginPath();
      drops.forEach(function(d){ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.l*.25,d.y+d.l);d.y+=d.v*dt;d.x-=d.v*dt*.25;if(d.y>H){d.y=-20;d.x=R()*(W+160)-40}});ctx.stroke()}
    if(flakes.length){ctx.fillStyle='rgba(255,255,255,.9)';flakes.forEach(function(f){f.y+=f.v*dt;f.x+=Math.sin(time+f.ph)*18*dt;if(f.y>H+5){f.y=-5;f.x=R()*W}ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,6.3);ctx.fill()})}
    if(k==='storm'){if(flash<=0&&R()<dt*.3)flash=1;if(flash>0){ctx.fillStyle='rgba(255,255,255,'+flash*.55+')';ctx.fillRect(0,0,W,H);flash-=dt*3.2}}
  }
  function loop(ts){if(!alive)return;raf=requestAnimationFrame(loop);var dt=last?Math.min(.05,(ts-last)/1000):0;last=ts;draw(dt)}
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)draw(0);else raf=requestAnimationFrame(loop);
  addEventListener('resize',size);
  return function(){alive=false;cancelAnimationFrame(raf);removeEventListener('resize',size)};
}
/* ---- 天氣畫面 ---- */
function advice(w){
  var a=[];
  a.push(w.p>=60?'☔ 降雨機率高，記得帶傘／雨衣':w.p>=30?'🌂 可能會下雨，包包放折疊傘':'😎 降雨機率低');
  if(w.lo<=14)a.push('🧥 早晚偏涼，帶件外套');else if(w.hi>=27)a.push('🥵 偏熱，記得補水防曬');else if(w.hi-w.lo>=7)a.push('🧅 日夜溫差大，洋蔥式穿搭');
  return a.join('<br>');
}
function repHour(w,nowH){
  if(nowH>=0&&w.h[nowH])return w.h[nowH];
  var b=null;for(var h=9;h<=20;h++){var x=w.h[h];if(x&&x.p>=60&&(!b||x.p>b.p))b=x}
  return b||w.h[12]||w.h[0];
}
function closeOv(instant){
  if(stopFx){stopFx();stopFx=null}
  if(!ovEl)return;var el=ovEl;ovEl=null;
  if(instant){el.remove();return}
  el.classList.remove('in');setTimeout(function(){el.remove()},450);
}
function show(i){
  var day=DAYS[i],w=day&&WX[day.d];if(!w)return false;
  var had=!!ovEl;closeOv(true);ovI=i;
  var today=liveDayIdx()===i,nowH=today?jstH(Date.now()):-1;
  var r=repHour(w,nowH),k=kindOf(r.c),night=isNight(w,r.h);
  var shown=w.h.filter(function(x){return x.h>=6});
  var tt=shown.map(function(x){return x.t}),mn=Math.min.apply(0,tt),mx=Math.max.apply(0,tt);
  var px=function(n){return (n+.5)*CW},py=function(v){return mx===mn?32:46-(v-mn)/(mx-mn)*28};
  var d='M'+px(0)+' '+py(tt[0]);
  for(var n=1;n<tt.length;n++){var mid=(px(n-1)+px(n))/2;d+=' C'+mid+' '+py(tt[n-1])+' '+mid+' '+py(tt[n])+' '+px(n)+' '+py(tt[n])}
  var svg='<svg class="wxsvg" width="'+shown.length*CW+'" height="56" viewBox="0 0 '+shown.length*CW+' 56"><path d="'+d+'" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>'+
    tt.map(function(v,j){return '<circle cx="'+px(j)+'" cy="'+py(v)+'" r="3.5" fill="#fff"/><text x="'+px(j)+'" y="'+(py(v)-9)+'" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">'+v+'°</text>'}).join('')+'</svg>';
  var cols=shown.map(function(x){
    var kk=kindOf(x.c),nn=isNight(w,x.h),ic=(kk==='clear'&&nn)?'🌙':(kk==='partly'&&nn)?'☁️':ICON[kk];
    return '<div class="wxcol'+(nowH===x.h?' now':'')+'"><div class="wxh">'+pad(x.h)+'</div><div class="wxic">'+ic+'</div><div class="wxsp"></div><div class="wxbar"><i style="height:'+Math.max(2,Math.round(x.p*.3))+'px"></i></div><div class="wxpp">'+x.p+'%</div></div>'}).join('');
  var fl=flags(i),ids=Object.keys(fl);
  var gs=[];ids.forEach(function(id){var f=fl[id],g=gs.find(function(x){return x.tip===f.tip});if(!g){g={tip:f.tip,rows:[]};gs.push(g)}g.rows.push(f)});
  var alt=ids.length?'<div class="wxalt"><div class="wxat">☔ 雨天備案</div>'+gs.map(function(g){return '<div class="wxai"><b>'+g.rows.map(function(f){return pad(f.h)+':00 '+esc(f.title)+'　💧'+f.p+'%'}).join('<br>')+'</b><div>'+esc(g.tip)+'</div></div>'}).join('')+'</div>':'<div class="wxalt ok">☀️ 這天的戶外行程目前沒有降雨疑慮</div>';
  var mo=day.d.split('-');
  var big=today?'<div class="wxt">'+r.t+'°</div><div class="wxs">'+LABEL[k]+'｜體感 '+r.a+'°｜風 '+r.w+' km/h</div><div class="wxs">高 '+w.hi+'° / 低 '+w.lo+'°｜💧 '+w.p+'%</div>':
    '<div class="wxt">'+w.hi+'°<span style="font-size:30px;opacity:.7"> / '+w.lo+'°</span></div><div class="wxs">'+LABEL[kindOf(w.c)]+'｜💧 最高 '+w.p+'%｜🌅 '+w.sr+'　🌇 '+w.ss+'</div>';
  var el=document.createElement('div');el.className='wxo';el.id='wxo';el.dataset.k=k;el.dataset.n=night?'1':'0';
  el.innerHTML='<canvas class="wxc"></canvas><div class="wxp">'+
   '<div class="wxtop"><button data-wxn="-1"'+(i<=0?' disabled':'')+' aria-label="前一天">‹</button><div class="wxnm"><b>'+(today?'今天':(+mo[1])+'/'+(+mo[2])+'（'+day.wd+'）預報')+'</b><span>'+day.em+' '+esc(day.name)+'</span></div><button data-wxn="1"'+(i>=DAYS.length-1?' disabled':'')+' aria-label="後一天">›</button><button data-wxx="1" aria-label="關閉">✕</button></div>'+
   '<div class="wxbig"><div class="wxi">'+((k==='clear'&&night)?'🌙':ICON[k])+'</div><div>'+big+'</div></div>'+
   '<div class="wxadv">'+advice(w)+'</div>'+
   '<div class="wxcard"><h4>🕒 逐時預報（氣溫／降雨機率）</h4><div class="wxscroll" id="wxsc"><div class="wxin">'+cols+svg+'</div></div></div>'+
   alt+
   '<button class="wxgo" data-wxgo="1">'+(today?'開始今天的行程 →':'看這天的行程 →')+'</button>'+
   '<div class="wxft">天氣資料：<a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a>（CC BY 4.0）</div></div>';
  document.body.appendChild(el);ovEl=el;
  stopFx=fx(el.querySelector('canvas'),k,r.mm,night);
  var sc=document.getElementById('wxsc');if(sc){var hh=nowH>=6?nowH:8;sc.scrollLeft=Math.max(0,(hh-6)*CW-CW)}
  if(had)el.classList.add('in');else requestAnimationFrame(function(){requestAnimationFrame(function(){el.classList.add('in')})});
  return true;
}
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');if(!b)return;
  if(b.dataset.wx!==undefined)show(+b.dataset.wx);
  else if(b.dataset.wxm!==undefined){var m=document.getElementById('menu');if(m)m.hidden=true;if(!show(cur))alert('天氣資料載入中或目前離線，稍後再試')}
  else if(b.dataset.wxn)show(Math.max(0,Math.min(DAYS.length-1,ovI+ +b.dataset.wxn)));
  else if(b.dataset.wxx!==undefined)closeOv();
  else if(b.dataset.wxgo!==undefined){var i=ovI;closeOv();if(i!==cur){cur=i;refit=true;render();scrollTo(0,0)}}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ovEl)closeOv()});
var mt=document.querySelector('#menu [data-m="tour"]');
if(mt)mt.insertAdjacentHTML('beforebegin','<button data-wxm="1">🌤️ 天氣預報</button>');
/* ---- 每天第一次開啟（含從背景回到前景遇到新的一天）自動跳出 ---- */
function auto(){
  if(ovEl)return;
  var now=new Date(),dk=now.getFullYear()+'-'+pad(now.getMonth()+1)+'-'+pad(now.getDate());
  if(store.get('wx:seen')===dk)return;
  if(jstDate(Date.now())>DAYS[DAYS.length-1].d)return;       /* 旅程結束後不再跳出 */
  var li=liveDayIdx(),i=li>=0?li:cur,tries=0;
  (function go(){var t=document.getElementById('tour');if(t&&!t.hidden&&tries++<180)return setTimeout(go,1000);
    if(!ovEl&&show(i))store.set('wx:seen',dk)})();
}
document.addEventListener('visibilitychange',function(){if(!document.hidden)load().then(auto)});
setTimeout(function(){load().then(auto)},700);
inject();
})();
